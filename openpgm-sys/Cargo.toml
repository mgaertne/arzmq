[package]
name = "openpgm-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
build = "build.rs"
autotests = false
autobins = false
autoexamples = false
autobenches = false
links = "pgm"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgaertne/arzmq"
keywords = ["openpgm", "pgm", "bindings", "ffi"]
categories = ["external-ffi-bindings"]
description = "Low-level bindings to the openpgm library"

[lints]
workspace = true

[lib]
test = false
doc = false
doctest = false
bench = false

[features]
default = []
native = []

[build-dependencies]
cc = { version = ">=1.2.22", default-features = false, features = ["parallel"] }
chrono = { version = ">=0.4.41", default-features = false, features = [ "alloc", "clock" ] }
